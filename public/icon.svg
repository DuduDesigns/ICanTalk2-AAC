<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="108" fill="url(#grad1)" />
  
  <!-- 4 AAC Grid Tiles Representation -->
  <g transform="translate(76, 76)" filter="url(#shadow)">
    <!-- Yellow Tile: Pronoun / Me -->
    <rect x="0" y="0" width="168" height="168" rx="28" fill="#fef08a" stroke="#eab308" stroke-width="8"/>
    <circle cx="84" cy="64" r="28" fill="#ca8a04" />
    <path d="M44 140 C44 104, 124 104, 124 140" fill="#ca8a04" />

    <!-- Green Tile: Verb / Want / Action -->
    <rect x="192" y="0" width="168" height="168" rx="28" fill="#bbf7d0" stroke="#16a34a" stroke-width="8"/>
    <path d="M246 84 L276 54 L306 84 M276 56 L276 124" fill="none" stroke="#15803d" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Orange Tile: Noun / Object -->
    <rect x="0" y="192" width="168" height="168" rx="28" fill="#fed7aa" stroke="#ea580c" stroke-width="8"/>
    <circle cx="84" cy="276" r="42" fill="#ea580c" />
    <path d="M84 234 Q98 214 114 220" fill="none" stroke="#65a30d" stroke-width="8" stroke-linecap="round"/>

    <!-- Blue Tile: Speech Bubble / Voice -->
